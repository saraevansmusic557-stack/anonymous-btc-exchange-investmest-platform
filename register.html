<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Anonymous BTC Real</title>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
  </head>

<body class="auth-page">

  <div class="auth-box">

    <div class="logo">
      <span>₿</span>
      <strong>Anonymous BTC</strong>
    </div>

    <h1>Create your account</h1>
    <p class="subtitle">
      Create a real account to access your personal dashboard.
    </p>

    <div class="real-warning">
      REAL ACCOUNT — Real money or transactions are processed.
    </div>

    <form id="registerForm">

      <label>Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label>Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label>Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >

      <button type="submit" class="main-button">
        Create Real Account
      </button>

    </form>

    <p class="bottom-text">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

    <a href="index.html" class="back-link">← Back to Home</a>

  </div>

  <script src="auth.js"></script>
</body>
                             </html>
