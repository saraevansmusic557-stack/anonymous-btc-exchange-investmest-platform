<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Anonymous BTC Real</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <div class="auth-box">

    <div class="logo">
      <span>₿</span>
      <strong>Anonymous BTC</strong>
    </div>

    <h1>Welcome back</h1>

    <p class="subtitle">
      Login to your real dashboard.
    </p>

    <div class="real-warning">
      REAL ACCOUNT — Real money or transactions are processed.
    </div>

    <form id="loginForm">

      <label>Email Address</label>
      <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
        required
      >

      <button type="submit" class="main-button">
        Login
      </button>

    </form>

    <p class="bottom-text">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </p>

    <a href="index.html" class="back-link">← Back to Home</a>

  </div>

  <script src="auth.js"></script>
</body>
</html>
